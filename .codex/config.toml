#:schema https://developers.openai.com/codex/config-schema.json

default_permissions = "container-dev"


# ----------------------------------------------------------------------
# Container development profile
# ----------------------------------------------------------------------

[permissions.container-dev]

# Workspace files may be modified.
[permissions.container-dev.filesystem]
":workspace_roots" = "write"

# Optional additional directories outside the repo.
# I would leave these absent unless you actually need them.
#
# "~/.cache/some-build-tool" = "write"


[permissions.container-dev.network]
enabled = true

# Useful if commands need to connect to services published on localhost.
allow_local_binding = true


[permissions.container-dev.network.domains]

# Host services / your web app
"localhost" = "allow"
"127.0.0.1" = "allow"

# Common source/package services.
"github.com" = "allow"
"**.github.com" = "allow"

# Add only the registries your project actually uses.
"registry-1.docker.io" = "allow"
"auth.docker.io" = "allow"
"production.cloudflare.docker.com" = "allow"

# Examples if applicable:
# "pypi.org" = "allow"
# "files.pythonhosted.org" = "allow"
# "registry.npmjs.org" = "allow"


# Allow sandboxed commands to contact the host Docker daemon.
[permissions.container-dev.network.unix_sockets]
"/var/run/docker.sock" = "allow"

